apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: olaf-hahn-at-dev

resources:
  - ../../base

configMapGenerator:
  - name: todo-app-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DB_USERS=todo_dev_users
      - DB_SESSIONS=todo_dev_sessions
      - DB_API_TOKENS=todo_dev_api_tokens
      - DB_TODOS=todo_dev_todos

images:
  - name: todo-api
    newName: quay.io/olaf_hahn_at/todoapp-bob-oh/todo-api
    newTag: latest
  - name: todo-web
    newName: quay.io/olaf_hahn_at/todoapp-bob-oh/todo-web
    newTag: latest
