apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app-prod

resources:
  - ../../base

configMapGenerator:
  - name: todo-app-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - COOKIE_SECURE=true

images:
  - name: todo-api
    newName: image-registry.openshift-image-registry.svc:5000/todo-app-prod/todo-api
    newTag: v1.0.0
  - name: todo-web
    newName: image-registry.openshift-image-registry.svc:5000/todo-app-prod/todo-web
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: todo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: todo-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
