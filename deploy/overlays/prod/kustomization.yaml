apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: olaf-hahn-at-dev

resources:
  - ../../base

configMapGenerator:
  - name: todo-app-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - COOKIE_SECURE=true

images:
  - name: todo-api
    newName: quay.io/olaf_hahn_at/todoapp-bob-oh/todo-api
    newTag: v1.0.0
  - name: todo-web
    newName: quay.io/olaf_hahn_at/todoapp-bob-oh/todo-web
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: todo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: todo-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
