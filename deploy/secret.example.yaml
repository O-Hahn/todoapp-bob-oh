apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secret
type: Opaque
stringData:
  # Cloudant URL (HTTPS external database)
  CLOUDANT_URL: "https://your-cloudant-instance.ibmcognitiveclass.ai"
  # Authentication: Provide CLOUDANT_APIKEY (IAM) OR CLOUDANT_USERNAME / CLOUDANT_PASSWORD (Basic Auth)
  CLOUDANT_APIKEY: "your-ibm-cloud-iam-api-key"
  # CLOUDANT_USERNAME: "admin"
  # CLOUDANT_PASSWORD: "password"
  # Random 32+ bytes hex session secret
  SESSION_SECRET: "your-cryptographically-secure-random-32-bytes-session-secret"
