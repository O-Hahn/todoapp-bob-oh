apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: todo-api-build
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: api
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: server/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: todo-api:latest
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: todo-web-build
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: web
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: web/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: todo-web:latest
