apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-allow-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: todo-app
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-web-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  egress:
    # Allow DNS (OpenShift DNS pods listen on 5353; the service port 53 is DNAT'ed to it)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Allow external HTTPS for Cloudant & K8s API (443 via service, 6443 after DNAT)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress
