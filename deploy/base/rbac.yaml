apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todo-admin-secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todo-admin-secret-manager-binding
subjects:
  - kind: ServiceAccount
    name: todo-app-api
roleRef:
  kind: Role
  name: todo-admin-secret-manager
  apiGroup: rbac.authorization.k8s.io
