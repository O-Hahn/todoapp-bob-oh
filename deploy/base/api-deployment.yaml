apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-app
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-app
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: todo-app-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: todo-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: todo-app-config
          env:
            - name: HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLOUDANT_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: CLOUDANT_URL
            - name: CLOUDANT_APIKEY
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: CLOUDANT_APIKEY
                  optional: true
            - name: CLOUDANT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: CLOUDANT_USERNAME
                  optional: true
            - name: CLOUDANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: CLOUDANT_PASSWORD
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
