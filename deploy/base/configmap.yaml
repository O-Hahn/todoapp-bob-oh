apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  COOKIE_SECURE: "true"
  DB_USERS: "todo_users"
  DB_SESSIONS: "todo_sessions"
  DB_API_TOKENS: "todo_api_tokens"
  DB_TODOS: "todo_todos"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_SECRET_NAME: "todo-admin-initial"
