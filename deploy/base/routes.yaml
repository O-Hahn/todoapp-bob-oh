apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: todo-app-web
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: web
spec:
  path: /
  to:
    kind: Service
    name: todo-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: todo-app-api
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: api
spec:
  path: /api
  to:
    kind: Service
    name: todo-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: todo-app-mcp
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: api
spec:
  path: /mcp
  to:
    kind: Service
    name: todo-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
