services:
  couchdb:
    image: docker.io/library/couchdb:3.4.2
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5984/_up"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    # nginx in the web image proxies to http://todo-api:8080 (the in-cluster Service name)
    networks:
      default:
        aliases:
          - todo-api
    build:
      context: .
      dockerfile: server/Containerfile
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      CLOUDANT_URL: "http://couchdb:5984"
      CLOUDANT_USERNAME: "admin"
      CLOUDANT_PASSWORD: "password"
      DB_USERS: "todo_users"
      DB_SESSIONS: "todo_sessions"
      DB_API_TOKENS: "todo_api_tokens"
      DB_TODOS: "todo_todos"
      SESSION_SECRET: "compose_development_secret_32_bytes_long_12345"
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: "admin@example.com"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Containerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - api
