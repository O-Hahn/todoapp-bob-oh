spec_version: v1
kind: mcp
name: todo_mcp_toolkit
display_name: ToDo Application MCP Toolkit
description: Remote Streamable HTTP MCP toolkit connecting to the ToDo App on OpenShift for todo management
transport: streamable_http
server_url: https://todo-app-mcp-todo-app.apps.cluster.example.com/mcp
tools:
  - "*"
headers:
  Authorization: "Bearer ${TODO_MCP_API_TOKEN}"
